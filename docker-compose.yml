version: '3.8'

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile.service
  restart: unless-stopped
  env_file: .env
  environment:
    # Remote AWS databases
    MYSQL_HOST: 3.80.47.57
    MYSQL_PORT: 3306
    MYSQL_USER: teamuser
    MYSQL_PASSWORD: ChangeThisMySQLPass123!
    MYSQL_DATABASE: team_mysql_db
    MONGO_HOST: 3.80.47.57
    MONGO_PORT: 27017
    MONGO_USER: teammongo
    MONGO_PASSWORD: ChangeThisMongoUserPass123!
    MONGO_DATABASE: team_mongo_db
    MONGO_AUTH_SOURCE: team_mongo_db
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  depends_on:
    mysql:
      condition: service_healthy
    mongodb:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_started

services:
  # ─── Data Layer ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: linkedin-mysql
    restart: unless-stopped
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: linkedin-mongodb
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-linkedin}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkedin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  kafka:
    image: apache/kafka:3.7.0
    container_name: linkedin-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kraft-combined-logs


  # ─── Microservices ─────────────────────────────────────────────────────────
  profile-service:
    <<: *backend-common
    container_name: linkedin-profile-service
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        ENTRY_POINT: main_profile.py

  job-service:
    <<: *backend-common
    container_name: linkedin-job-service
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        ENTRY_POINT: main_job.py

  application-service:
    <<: *backend-common
    container_name: linkedin-application-service
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        ENTRY_POINT: main_application.py

  messaging-service:
    <<: *backend-common
    container_name: linkedin-messaging-service
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        ENTRY_POINT: main_messaging.py

  connection-service:
    <<: *backend-common
    container_name: linkedin-connection-service
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        ENTRY_POINT: main_connection.py

  analytics-service:
    <<: *backend-common
    container_name: linkedin-analytics-service
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        ENTRY_POINT: main_analytics.py

  ai-service:
    <<: *backend-common
    container_name: linkedin-ai-service
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        ENTRY_POINT: main_ai.py

  # ─── API Gateway ───────────────────────────────────────────────────────────
  gateway:
    image: nginx:alpine
    container_name: linkedin-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - profile-service
      - job-service
      - analytics-service

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: linkedin-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - gateway

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  kafka_data:
