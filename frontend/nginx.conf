server {
    listen       5173;
    client_max_body_size 10M;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Use Docker's internal DNS so nginx resolves upstream lazily (per-request)
    # instead of at startup — prevents crash when gateway isn't ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API calls to the backend service (Docker DNS resolves to the
    # backend container).  This avoids CORS and the IPv4/IPv6 ambiguity of
    # hardcoding 127.0.0.1:8000 in the browser bundle.
    location /api/ {
        proxy_pass         http://gateway:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket upgrade (AI task streaming)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
    }

    # React SPA: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
