events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Timeouts for long AI requests
    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;
    send_timeout          300;
    client_max_body_size  10M;

    server {
        listen 8000;
        server_name localhost;
        
        # Docker DNS resolver
        resolver 127.0.0.11 valid=30s;

        # ─── Health / Root ───────────────────────────────────────────────────
        location / {
            set $upstream_profile profile-service:8000;
            proxy_pass http://$upstream_profile;
        }

        # ─── Auth & Profile Service ──────────────────────────────────────────
        location /auth/ {
            set $upstream_profile profile-service:8000;
            proxy_pass http://$upstream_profile;
        }
        location /members/ {
            set $upstream_profile profile-service:8000;
            proxy_pass http://$upstream_profile;
        }
        location /recruiters/ {
            set $upstream_profile profile-service:8000;
            proxy_pass http://$upstream_profile;
        }
        location /notifications/ {
            set $upstream_profile profile-service:8000;
            proxy_pass http://$upstream_profile;
        }

        # ─── Job Service ─────────────────────────────────────────────────────
        location /jobs/ {
            set $upstream_job job-service:8000;
            proxy_pass http://$upstream_job;
        }
        location /posts/ {
            set $upstream_job job-service:8000;
            proxy_pass http://$upstream_job;
        }

        # ─── Application Service ─────────────────────────────────────────────
        location /applications/ {
            set $upstream_app application-service:8000;
            proxy_pass http://$upstream_app;
        }

        # ─── Messaging Service ───────────────────────────────────────────────
        location /threads/ {
            set $upstream_msg messaging-service:8000;
            proxy_pass http://$upstream_msg;
        }
        location /messages/ {
            set $upstream_msg messaging-service:8000;
            proxy_pass http://$upstream_msg;
        }

        # ─── Connection Service ──────────────────────────────────────────────
        location /connections/ {
            set $upstream_conn connection-service:8000;
            proxy_pass http://$upstream_conn;
        }

        # ─── Analytics Service ───────────────────────────────────────────────
        location /analytics/ {
            set $upstream_analytics analytics-service:8000;
            proxy_pass http://$upstream_analytics;
        }
        location /events/ {
            set $upstream_analytics analytics-service:8000;
            proxy_pass http://$upstream_analytics;
        }
        location /perf/ {
            set $upstream_analytics analytics-service:8000;
            proxy_pass http://$upstream_analytics;
        }

        # ─── AI Service ──────────────────────────────────────────────────────
        location /ai/ {
            set $upstream_ai ai-service:8000;
            proxy_pass http://$upstream_ai;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
