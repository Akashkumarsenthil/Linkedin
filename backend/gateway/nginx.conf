events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Timeouts for long AI requests
    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;
    send_timeout          300;
    client_max_body_size  10M;

    server {
        listen 8000;
        server_name localhost;
        
        # CORS Headers
        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Docker DNS resolver
        resolver 127.0.0.11 valid=30s;

        # ─── Auth & Profile Service ──────────────────────────────────────────
        location /auth/ {
            set $upstream_profile profile-service:8000;
            proxy_pass http://$upstream_profile;
        }
        location /members/ {
            set $upstream_profile profile-service:8000;
            proxy_pass http://$upstream_profile;
        }
        location /recruiters/ {
            set $upstream_profile profile-service:8000;
            proxy_pass http://$upstream_profile;
        }
        location /notifications/ {
            set $upstream_profile profile-service:8000;
            proxy_pass http://$upstream_profile;
        }

        # ─── Job Service ─────────────────────────────────────────────────────
        location /jobs/ {
            set $upstream_job job-service:8000;
            proxy_pass http://$upstream_job;
        }
        location /posts/ {
            set $upstream_job job-service:8000;
            proxy_pass http://$upstream_job;
        }

        # ─── Application Service ─────────────────────────────────────────────
        location /applications/ {
            set $upstream_app application-service:8000;
            proxy_pass http://$upstream_app;
        }

        # ─── Messaging Service ───────────────────────────────────────────────
        location /threads/ {
            set $upstream_msg messaging-service:8000;
            proxy_pass http://$upstream_msg;
        }
        location /messages/ {
            set $upstream_msg messaging-service:8000;
            proxy_pass http://$upstream_msg;
        }

        # ─── Connection Service ──────────────────────────────────────────────
        location /connections/ {
            set $upstream_conn connection-service:8000;
            proxy_pass http://$upstream_conn;
        }

        # ─── Analytics Service ───────────────────────────────────────────────
        location /analytics/ {
            set $upstream_analytics analytics-service:8000;
            proxy_pass http://$upstream_analytics;
        }
        location /events/ {
            set $upstream_analytics analytics-service:8000;
            proxy_pass http://$upstream_analytics;
        }
        location /perf/ {
            set $upstream_analytics analytics-service:8000;
            proxy_pass http://$upstream_analytics;
        }

        # ─── AI Service ──────────────────────────────────────────────────────
        location /ai/ {
            set $upstream_ai ai-service:8000;
            proxy_pass http://$upstream_ai;

            # WebSocket support (required for /ai/ws/{task_id})
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # ─── Health / Root ───────────────────────────────────────────────────
        location / {
            set $upstream_profile profile-service:8000;
            proxy_pass http://$upstream_profile;
        }

        # ─── Error Handling ──────────────────────────────────────────────────
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
